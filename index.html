<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八百万の神々 神社＆神々探訪マップ - 荘厳UI版 -</title>
    
    <!-- Google Fonts (Noto Serif JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js (地図ライブラリ) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- 独自のスタイル -->
    <link rel="stylesheet" href="css/style.css?v=20260730_10">
</head>
<body class="map-mode">
    
    <!-- ヘッダー (漆黒・黄金 & ナビゲーション) -->
    <header class="main-header">
        <h1><span class="torii">⛩</span> 八百万の神々</h1>
        
        <!-- 画面切り替えタブ -->
        <nav class="header-nav">
            <button class="nav-tab active" data-view="map-view">🗺 神社マップ</button>
            <button class="nav-tab" data-view="god-view">📜 神さま図鑑</button>
            <button class="nav-tab" data-view="log-view">📖 参拝ログ</button>
        </nav>

        <div class="header-search">
            <input type="text" id="jinja-search" placeholder="🔍 社名・祭神・キーワード検索...">
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- 1. 神社マップビュー                                           -->
    <!-- ============================================================ -->
    <div id="map-view" class="view-section active">
        <main id="map"></main>

        <!-- 左サイドバー -->
        <div id="sidebar" class="washi-texture collapsable">
            <button id="sidebar-toggle" class="jinja-btn">⛩ 絞り込み</button>
            <div class="sidebar-content">
                <div class="jinja-list-container">
                    <h3>神社一覧</h3>
                    <ul id="jinja-list"></ul>
                </div>
            </div>
        </div>

        <!-- 詳細ポップアップパネル -->
        <div id="detail-panel" class="washi-texture popup">
            <button id="detail-close" class="close-btn">×</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 2. 神さま図鑑（台帳）ビュー 【完成UIの復元エリア】           -->
    <!-- ============================================================ -->
    <div id="god-view" class="view-section washi-texture">
        <div class="god-daicho-container">
            
            <!-- 左パネル: 系統フィルター ＆ 神さまリスト -->
            <div class="god-left-panel">
                <div class="god-category-tabs">
                    <button class="god-cat-tab active" data-cat="all">すべて</button>
                    <button class="god-cat-tab" data-cat="amatsukami">☀️ 天津神</button>
                    <button class="god-cat-tab" data-cat="kunitsukami">🐉 国津神</button>
                    <button class="god-cat-tab" data-cat="other">👤 その他</button>
                </div>
                <div class="god-list-scroll">
                    <ul id="god-daicho-list"></ul>
                </div>
            </div>

            <!-- 右パネル: 詳細 ＆ FamilyTree（相関図） -->
            <div class="god-right-panel">
                <div class="god-detail-tabs">
                    <button class="god-view-tab" data-tab="detail">📜 神様詳細</button>
                    <button class="god-view-tab active" data-tab="tree">🌳 FamilyTree (系譜図)</button>
                </div>
                
                <!-- 詳細表示コンテンツ -->
                <div id="god-tab-detail-content" class="god-tab-content">
                    <div id="god-profile-display">
                        <p class="placeholder-text">左側のリストから神さまを選択してください。</p>
                    </div>
                </div>

                <!-- FamilyTree描画領域 -->
                <div id="god-tab-tree-content" class="god-tab-content active">
                    <div id="embedded-tree-container"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 3. 参拝ログビュー                                             -->
    <!-- ============================================================ -->
    <div id="log-view" class="view-section washi-texture">
        <div class="view-container">
            <h2>📖 参拝録</h2>
            <p class="view-desc">あなたの神社巡りの記録です。</p>
            <div id="log-list-container"></div>
        </div>
    </div>

    <!-- ポップアップモーダル（マップからの相関図呼び出し用） -->
    <div id="tree-modal" class="modal washi-texture">
        <div class="modal-content">
            <button id="modal-close" class="close-btn">×</button>
            <div id="tree-container"></div>
        </div>
    </div>

    <!-- スクリプトの読み込み -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script src="js/tree.js?v=20260730_10"></script>
    <script src="js/app.js?v=20260730_10"></script>
</body>
</html>
