<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八百万の神々 神社＆神々探訪マップ - 完全無料版 -</title>
    
    <!-- Google Fonts (明朝体) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js (地図ライブラリ) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- 独自のスタイル -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- ヘッダー -->
    <header>
        <h1><span class="torii">⛩</span> 八百万の神々 神社＆神々探訪マップ</h1>
        <div class="search-container">
            <input type="text" id="jinja-search" placeholder="🔍 社名・祭神・地域で検索...">
        </div>
    </header>

    <!-- メイン領域：地図 (OpenStreetMap) -->
    <main id="map"></main>

    <!-- 左サイドバー -->
    <div id="sidebar" class="washi-texture collapsable">
        <button id="sidebar-toggle" class="jinja-btn">⛩ 絞り込み</button>
        <div class="sidebar-content">
            <!-- (中略: 以前のフィルター等はそのまま) -->
            <div class="jinja-list-container">
                <h3>神社一覧</h3>
                <ul id="jinja-list"></ul>
            </div>
        </div>
    </div>

    <!-- 詳細パネル (下からポップアップ・ID非表示) -->
    <div id="detail-panel" class="washi-texture popup">
        <button id="detail-close" class="close-btn">×</button>
        <div id="detail-content"></div>
    </div>

    <!-- FamilyTreeモーダル (既存依存) -->
    <div id="tree-modal" class="modal washi-texture">
        <div class="modal-content">
            <button id="modal-close" class="close-btn">×</button>
            <div id="tree-container"></div>
        </div>
    </div>

    <!-- ライブラリとスクリプトの読み込み (順番が重要) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- ※ config.js (Mapboxトークン) は読み込みません ※ -->
    <script src="js/tree.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
