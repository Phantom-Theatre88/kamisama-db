<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>八百万の神々 神社＆神々探訪マップ - 荘厳UI版 -</title>
    
    <!-- ★重要：Google Fonts (Noto Serif JP) の読み込みを追加★ -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js (地図ライブラリ) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- 独自のスタイル -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="map-mode">
    
    <!-- ヘッダー -->
    <header>
        <h1><span class="torii">⛩</span> 八百万の神々 神社＆神々探訪マップ</h1>
        <div class="search-container">
            <input type="text" id="jinja-search" placeholder="🔍 社名・祭神・地域で検索...">
        </div>
    </header>

    <!-- メイン領域：地図 -->
    <main id="map"></main>

    <!-- (中略: サイドバー、詳細パネル、モーダルなどは以前提示した統合版index.htmlと同じ) -->

    <!-- ライブラリとスクリプトの読み込み -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- ※ config.js は不要になるため読み込みません ※ -->
    <script src="js/tree.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
